<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/admin.css">
<title>Painel +1</title>
</head>
<body class="admin-body">

<!-- TELA DE LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="nav-brand" style="margin-bottom:20px;">
      <img src="assets/img/icon.svg" class="brand-icon" alt="Mais Uma Caipirinha">
      <span class="wordmark">Mais Uma Caipirinha</span>
    </div>
    <h1>Painel</h1>
    <p>Entre com sua conta para gerenciar cardápio, loja, agenda, fotos e configurações do site.</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <div class="form-error" id="loginError"></div>
      <button type="submit" class="btn btn-amber btn-block">Entrar</button>
      <button type="button" id="forgotPasswordBtn" class="link-btn">Esqueci minha senha / primeiro acesso</button>
      <div id="forgotStatus"></div>
    </form>
  </div>
</div>

<!-- PAINEL (só aparece autenticado) -->
<div id="adminScreen" style="display:none;">
  <header class="admin-header">
    <div class="nav-brand">
      <img src="assets/img/icon.svg" class="brand-icon" alt="Mais Uma Caipirinha">
      <span class="wordmark">Painel · Mais Uma Caipirinha</span>
    </div>
    <button class="admin-logout" id="logoutBtn">Sair</button>
  </header>

  <main class="admin-main">
    <div class="admin-tabs">
      <button class="admin-tab active" data-section="cardapio">Cardápio</button>
      <button class="admin-tab" data-section="loja">Loja</button>
      <button class="admin-tab" data-section="agenda">Agenda</button>
      <button class="admin-tab" data-section="fotos">Fotos do Hero</button>
      <button class="admin-tab" data-section="config">Configurações</button>
    </div>

    <div class="admin-panel active" id="panel-cardapio"></div>
    <div class="admin-panel" id="panel-loja"></div>
    <div class="admin-panel" id="panel-agenda"></div>
    <div class="admin-panel" id="panel-fotos"></div>
    <div class="admin-panel" id="panel-config"></div>
  </main>
</div>

<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
